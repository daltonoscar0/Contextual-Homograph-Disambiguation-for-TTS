name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # Deliberately not the full requirements.txt. torch, transformers and
      # spaCy are only needed to run the encoder, and the tests that use one
      # already skip themselves via _probe_available() in tests/test_api.py.
      # Installing them would add a multi-gigabyte download for 3 extra tests.
      - name: Install test dependencies
        run: pip install numpy scikit-learn pytest

      # tests/test_data.py and tests/test_lexicon.py read the Wikipedia
      # Homograph Data set and CMUdict, which are gitignored. This is the
      # repo's own fetch script: a shallow clone plus two curls, no auth.
      - name: Fetch corpus and pronunciation data
        run: bash scripts/fetch_data.sh

      - name: Run tests
        run: pytest -q
